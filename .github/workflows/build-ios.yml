name: Build iOS IPA (Sensi Bot Max)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios:
    name: Build Sensi Bot Max iOS IPA
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: |
          for xcode in /Applications/Xcode_16*.app /Applications/Xcode_16.app; do
            if [ -d "$xcode" ]; then
              echo "Selecting $xcode"
              sudo xcode-select -s "$xcode"
              break
            fi
          done
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          brew install xcodegen

      - name: Generate Xcode Project
        run: |
          cd ios
          xcodegen generate

      - name: Build SensiBotMax.app (xcodebuild)
        id: build_step
        continue-on-error: true
        run: |
          cd ios
          xcodebuild -project SensiBotMax.xcodeproj \
            -scheme SensiBotMax \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            DEVELOPMENT_TEAM="" > ../xcodebuild_output.txt 2>&1

      - name: Push Error Log If Failed
        if: steps.build_step.outcome != 'success'
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git checkout -B build-log-branch
          cp xcodebuild_output.txt build-error.log
          git add build-error.log
          git commit -m "ci: capture xcodebuild error log"
          git push -f origin build-log-branch
          exit 1

      - name: Package into IPA Payload & Enforce Fullscreen Keys
        run: |
          cd ios
          mkdir -p build/Payload
          cp -r build/DerivedData/Build/Products/Release-iphoneos/SensiBotMax.app build/Payload/

          # Enforce bundle metadata and full-screen launch screen keys
          python3 - << 'EOF'
          import plistlib
          import os
          import sys

          info_path = "build/Payload/SensiBotMax.app/Info.plist"
          src_path = "SensiBotMax/App/Info.plist"

          target = {}
          if os.path.exists(info_path):
              with open(info_path, "rb") as f:
                  target = plistlib.load(f)

          source = {}
          if os.path.exists(src_path):
              with open(src_path, "rb") as f:
                  source = plistlib.load(f)

          # Merge source into target
          for k, v in source.items():
              target[k] = v

          # Explicit concrete identification values (NEVER unexpanded $(...) variables)
          target["CFBundleIdentifier"] = "com.sensibotpro.ios"
          target["CFBundleExecutable"] = "SensiBotMax"
          target["CFBundleName"] = "SensiBotMax"
          target["CFBundleDisplayName"] = "Sensi Bot Max"
          target["CFBundleDevelopmentRegion"] = "en"
          target["CFBundlePackageType"] = "APPL"
          target["CFBundleInfoDictionaryVersion"] = "6.0"
          target["CFBundleShortVersionString"] = "1.0.6"
          target["CFBundleVersion"] = "7"

          # Force critical launch screen and fullscreen keys
          target["UILaunchStoryboardName"] = "LaunchScreen"
          target["UIRequiresFullScreen"] = True
          target["UILaunchScreen"] = {"UILaunchStoryboardName": "LaunchScreen"}
          target["LSRequiresIPhoneOS"] = True
          target["CADisableMinimumFrameDurationOnPhone"] = True
          target["UIUserInterfaceStyle"] = "Dark"
          target["UIBackgroundModes"] = ["audio", "voip"]
          target["UISupportedInterfaceOrientations"] = ["UIInterfaceOrientationPortrait"]

          # Variable expansion / cleanup for any remaining $(...) variables
          var_map = {
              "$(PRODUCT_BUNDLE_IDENTIFIER)": "com.sensibotpro.ios",
              "$(EXECUTABLE_NAME)": "SensiBotMax",
              "$(PRODUCT_NAME)": "SensiBotMax",
              "$(DEVELOPMENT_LANGUAGE)": "en",
          }
          for k, v in list(target.items()):
              if isinstance(v, str):
                  for var_key, var_val in var_map.items():
                      if var_key in v:
                          v = v.replace(var_key, var_val)
                          target[k] = v
                  if "$(" in v:
                      print(f"ERROR: Unresolved variable remaining in key {k}: {v}")
                      sys.exit(1)

          with open(info_path, "wb") as f:
              plistlib.dump(target, f)

          print("Successfully injected valid Info.plist:")
          for k in ["CFBundleIdentifier", "CFBundleExecutable", "CFBundleName", "CFBundleDisplayName", "CFBundleShortVersionString", "UILaunchStoryboardName", "UIRequiresFullScreen"]:
              print(f"  {k}: {target.get(k)}")
          EOF

          echo "Final Info.plist verification:"
          plutil -p build/Payload/SensiBotMax.app/Info.plist

          cd build
          zip -r -9 SensiBotMax_v1.0.6.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SensiBotMax_iOS_v1.0.6
          path: ios/build/SensiBotMax_v1.0.6.ipa
          retention-days: 14
