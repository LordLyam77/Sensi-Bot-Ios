name: Build iOS IPA (Sensi Bot Max)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build Sensi Bot Max iOS IPA
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: |
          brew install xcodegen

      - name: Generate Xcode Project
        run: |
          cd ios
          xcodegen generate

      - name: Build SensiBotMax.app (xcodebuild)
        run: |
          cd ios
          xcodebuild -project SensiBotMax.xcodeproj \
            -scheme SensiBotMax \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            DEVELOPMENT_TEAM=""

      - name: Package into IPA Payload
        run: |
          cd ios
          mkdir -p build/Payload
          cp -r build/DerivedData/Build/Products/Release-iphoneos/SensiBotMax.app build/Payload/
          cd build
          zip -r -9 SensiBotMax_v1.0.0.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SensiBotMax_iOS_v1.0.0
          path: ios/build/SensiBotMax_v1.0.0.ipa
          retention-days: 14
