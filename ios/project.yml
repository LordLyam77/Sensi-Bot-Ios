name: SensiBotMax
options:
  bundleIdPrefix: com.sensibotpro
  deploymentTarget:
    iOS: "15.0"
  xcodeVersion: "16.0"
targets:
  SensiBotMax:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: SensiBotMax
    info:
      path: SensiBotMax/App/Info.plist
      properties:
        CFBundleDisplayName: "Sensi Bot Max"
        CFBundleShortVersionString: "1.0.2"
        CFBundleVersion: "3"
        UILaunchStoryboardName: LaunchScreen
        UIRequiresFullScreen: true
        UILaunchScreen: {}
        CADisableMinimumFrameDurationOnPhone: true
        LSRequiresIPhoneOS: true
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sensibotpro.ios
        PRODUCT_NAME: SensiBotMax
        MARKETING_VERSION: "1.0.2"
        CURRENT_PROJECT_VERSION: "3"
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: SensiBotMax/App/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: "Sensi Bot Max"
        INFOPLIST_KEY_UILaunchStoryboardName: LaunchScreen
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_LSRequiresIPhoneOS: YES
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        AD_HOC_CODE_SIGNING_ALLOWED: YES
        ENABLE_BITCODE: NO
        TARGETED_DEVICE_FAMILY: "1"
